name: JWT Validity Probe
# Weekly brite-prod auth check (BC-11098, V3 item 8 Option B).
# Reduces worst-case blind window from ~90 days (ad-hoc) to ~7 days.
#
# Required repo secrets:
#   SFDX_AUTH_URL_PROD — sf CLI auth URL for brite-prod (refresh token)
#   LINEAR_API_KEY     — Linear API key for auto-filing alert issues
#
# Required repo variables (Settings > Variables > Actions):
#   LINEAR_TEAM_ID     — Brite Company team ID in Linear
#   LINEAR_ASSIGNEE_ID — Holden's Linear user ID (alert assignee)

on:
  schedule:
    - cron: '0 9 * * 1'  # Mondays 9:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

env:
  LINEAR_TEAM_ID: ${{ vars.LINEAR_TEAM_ID }}
  LINEAR_ASSIGNEE_ID: ${{ vars.LINEAR_ASSIGNEE_ID }}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install sf CLI
        # Pinned deliberately — Dependabot does not track `npm install -g`; bump on review.
        run: npm install -g @salesforce/cli@2.141.6

      - name: Authenticate to brite-prod
        run: |
          printf '%s' "${{ secrets.SFDX_AUTH_URL_PROD }}" > "$RUNNER_TEMP/sfdx-auth.txt"
          sf org login sfdx-url --sfdx-url-file "$RUNNER_TEMP/sfdx-auth.txt" --alias brite-prod
          rm -f "$RUNNER_TEMP/sfdx-auth.txt"

      - name: Probe auth validity
        id: probe
        run: |
          status=$(sf org display --target-org brite-prod --json 2>/dev/null | python3 -c "
          import json, sys
          try:
              d = json.load(sys.stdin)
              if d.get('status', 1) != 0:
                  print('AUTH_ERROR')
                  sys.exit(0)
              print(d.get('result', {}).get('connectedStatus', 'UNKNOWN'))
          except Exception:
              print('PARSE_FAILED')
          ")
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" = "Connected" ]; then
            echo "brite-prod auth: Connected"
          else
            echo "::error::brite-prod auth is NOT Connected (status: $status)"
            exit 4
          fi

      - name: File Linear issue on failure
        if: failure() && github.event_name == 'schedule' && github.ref == 'refs/heads/main'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          PROBE_STATUS: ${{ steps.probe.outputs.status }}
        run: |
          if [ -z "$LINEAR_API_KEY" ]; then
            echo "::warning::LINEAR_API_KEY not configured — cannot auto-file alert issue"
            exit 0
          fi
          if [ -z "$LINEAR_TEAM_ID" ] || [ -z "$LINEAR_ASSIGNEE_ID" ]; then
            echo "::warning::LINEAR_TEAM_ID or LINEAR_ASSIGNEE_ID variable not configured"
            exit 0
          fi
          python3 -c "
          import json, urllib.request, os
          body = json.dumps({
              'query': 'mutation(\$input: IssueCreateInput!) { issueCreate(input: \$input) { success issue { identifier url } } }',
              'variables': {
                  'input': {
                      'title': '[urgent] brite-prod SF auth expired — run rotation runbook',
                      'description': (
                          'Automated weekly JWT probe detected brite-prod auth is no longer Connected'
                          f' (status: {os.environ[\"PROBE_STATUS\"]}).\n\n'
                          'Runbook: brite-salesforce/docs/runbooks/sf-prod-auth-rotation.md\n'
                          'Probe workflow: .github/workflows/jwt-validity-probe.yml\n\n'
                          'This issue was auto-filed by the scheduled probe. Re-authenticate and close when resolved.'
                      ),
                      'teamId': os.environ['LINEAR_TEAM_ID'],
                      'assigneeId': os.environ['LINEAR_ASSIGNEE_ID'],
                      'priority': 1,
                  }
              }
          }).encode()
          req = urllib.request.Request(
              'https://api.linear.app/graphql',
              data=body,
              headers={'Content-Type': 'application/json', 'Authorization': os.environ['LINEAR_API_KEY']},
          )
          resp = json.loads(urllib.request.urlopen(req).read())
          issue = resp.get('data', {}).get('issueCreate', {}).get('issue', {})
          print(f'Filed: {issue.get(\"identifier\")} — {issue.get(\"url\")}')
          "
