name: Validate Plugin Structure

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate marketplace.json (fast-fail)
        run: |
          echo "Checking marketplace.json is valid JSON..."
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
          echo "marketplace.json is valid"

      - name: Validate all plugins
        run: bash scripts/validate.sh  # discovers plugins/*/ via marketplace.json

      - name: Test security hook regexes
        run: bash scripts/test-hooks.sh

      - name: Test hook model tier-alias lint
        run: bash scripts/test-hook-model-lint.sh

      - name: Test skill trigger matching
        run: bash scripts/test-skill-triggers.sh  # discovers all plugins/*/skills/_shared/trigger-registry.json

      - name: Test cross-skill contracts
        run: bash scripts/test-contracts.sh  # workflows-only by design (cross-skill handoffs)

      - name: Test end-to-end scenarios
        run: bash scripts/test-scenarios.sh  # workflows-only by design (project-start PRD scenarios)
