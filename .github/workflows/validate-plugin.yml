name: Validate Plugin Structure

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # least-privilege — all steps are read-only validators
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate marketplace.json (fast-fail)
        run: |
          echo "Checking marketplace.json is valid JSON..."
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
          echo "marketplace.json is valid"

      # scripts/validate.sh §2d/2f-2h now own the four harness checks that used
      # to run as separate steps here (test-hooks.sh, test-skill-triggers.sh,
      # test-contracts.sh, test-scenarios.sh) — single source of truth so a
      # green local `bash scripts/validate.sh` implies a green CI `validate`
      # job (BC-16287).
      - name: Validate all plugins
        run: bash scripts/validate.sh  # discovers plugins/*/ via marketplace.json

      # meta-test of the validate.sh hook-lint gate — invokes validate.sh
      # itself, so it must stay OUTSIDE the gate (recursion); the rule it tests
      # runs in-gate via scripts/_lib/lint_hooks.py
      - name: Test hook model tier-alias lint
        run: bash scripts/test-hook-model-lint.sh

  vslice-greenfield:
    # BC-7057 v-slice integration test: exercises FDA helper-script Phase 1 surface
    # against a synthetic greenfield fixture. Promoted advisory → required by BC-7713
    # (2026-05-22) after the BC-7713 calendar + green-PR gate cleared; a fail now
    # blocks the PR. Extends as BC-6959 sub-skills land. See plugins/flow-architecture/tests/vslice-report.md.
    # Also hosts the BC-7060 clone-drift classifier regression — co-located here for
    # v1.0; split into a dedicated `clone-drift-test` job sitting next to
    # `clone-drift-check` if a 2nd classifier regression test lands.
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 5
    permissions:
      contents: read  # least-privilege — harness scripts only read in-repo files
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run v-slice greenfield harness
        run: bash plugins/flow-architecture/tests/run-greenfield-vslice.sh

      - name: Run clone-drift classifier regression (BC-7060)
        run: bash plugins/flow-architecture/tests/test-clone-drift.sh

  python-units:
    # BC-16289 — executes the 26 previously-orphaned test_*.py files
    # (.github/dependabot.yml used to state plainly that Brite CI never
    # invoked pytest). Mirrors vslice-greenfield's shape (needs: validate,
    # dedicated job rather than a validate-job step) but is BLOCKING — no
    # continue-on-error — since the suite includes contract tests for the
    # revops PreToolUse validators (soql/security/naming/dispatcher/
    # llm-pattern) that gate Salesforce operations.
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 10
    permissions:
      contents: read  # least-privilege — the suites only read in-repo files
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pytest
        run: python3 -m pip install pytest

      - name: Run Python unit suites (revops/marketing/workflows)
        run: bash scripts/test-python-units.sh
        env:
          # This job installs pytest above, so a missing pytest here is a real
          # break → hard-fail. (Do NOT rely on CI=true for this: GitHub sets
          # CI=true in every job, including `validate`, which runs this wrapper
          # via validate.sh §2j WITHOUT installing pytest — keying on CI there
          # would fail that job spuriously. See test-python-units.sh guard.)
          REQUIRE_PYTEST: "true"

  python-lint:
    # BC-16867 / ADR-043 — the repo had NO Python lint gate anywhere after
    # BC-16371 removed the only-local pre-commit ruff (it depended on a leaked
    # root pyproject.toml stub). Config now lives in the real root
    # pyproject.toml [tool.ruff]; rules are E9 + pyflakes only, with today's 130
    # findings grandfathered per-file so this is green from day one.
    #
    # A dedicated job rather than a validate.sh section: validate.sh is
    # deliberately stdlib-only / no-pip, so it cannot assume ruff is installed —
    # putting the gate there would make it a silent no-op for anyone without
    # ruff. BLOCKING (no continue-on-error), mirroring python-units.
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 5
    permissions:
      contents: read  # least-privilege — ruff only reads in-repo files
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install ruff
        # Pinned: an unpinned ruff would let a new upstream release add rules to
        # E9/F (or change fix behavior) and red the gate on an untouched tree.
        # Bump deliberately, re-running the grandfather snapshot in pyproject.toml.
        run: python3 -m pip install 'ruff==0.16.0'

      - name: Ruff (E9 + pyflakes; config in root pyproject.toml)
        run: ruff check --output-format=github .

      - name: Ruff debt ratchet (no same-code regressions inside grandfathered files)
        # per-file-ignores silences a code for a WHOLE file, so the step above
        # cannot tell a pre-existing F401 from a brand-new one in the same file.
        # This second pass runs --isolated (ignoring the grandfather) and compares
        # per-(file, code) counts against the committed baseline, which only
        # ratchets down — the ADR-034 R2-baseline idiom applied to ruff.
        run: |
          # `ruff check` exits 1 whenever findings exist, and 130 legitimately do;
          # the ratchet script is the arbiter, so capture rather than propagate.
          ruff check --isolated --select E9,F --output-format=concise . \
            > "$RUNNER_TEMP/ruff-findings.txt" || true
          python3 scripts/_lib/check_ruff_debt.py docs/ruff-debt-baseline.tsv \
            < "$RUNNER_TEMP/ruff-findings.txt"

  vslice-inventory-only-rescaffold:
    # BC-9971 v-slice for the inventory-only-domain re-scaffold classifier
    # (flow-classify-domain-state.sh) — exercises the four classification
    # outcomes + input validation against three new fixtures. Advisory
    # (continue-on-error) per vslice-greenfield precedent.
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 3
    continue-on-error: true
    permissions:
      contents: read  # least-privilege — harness only reads fixture + script
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run BC-9971 inventory-only-rescaffold harness
        run: bash plugins/flow-architecture/tests/run-inventory-only-rescaffold-vslice.sh

  audit-smoke-test:
    # BC-7059 /flow:audit smoke test: exercises the Phase B (deterministic
    # filesystem) gate subset against clean + broken FDA-shape fixtures.
    # Advisory (continue-on-error) per issue spec — does not hard-block BC-6998
    # but recommended pre-dogfood. Phase A verify-docs.sh deep parsing and
    # Phase C Linear-MCP gates are skip-with-reason per vslice-greenfield
    # precedent (LLM-runner / Linear access not headlessly invocable).
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 3
    continue-on-error: true
    permissions:
      contents: read  # least-privilege — script only reads fixture files
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run /flow:audit smoke test (BC-7059)
        run: bash plugins/flow-architecture/tests/run-audit-smoke.sh

  mode-classifier-eval:
    # BC-7061 flow-architecture mode-classifier eval fixture: stages temp
    # project state per case and verifies scripts/flow-detect-mode.sh classifies
    # greenfield / retrofit / incremental-add / resume correctly. Advisory
    # (continue-on-error) per issue spec — does not hard-block BC-6998 but
    # protects the Q36.3 step-4 heuristic from silent regressions. The Q12.5
    # preamble emission and Q36.3 user-confirmation gate are skip-with-reason
    # per vslice-greenfield precedent (interactive / LLM-bound surfaces).
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 3
    continue-on-error: true
    permissions:
      contents: read  # least-privilege — harness only reads fixture + scripts
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run mode-classifier eval (BC-7061)
        run: bash plugins/flow-architecture/tests/run-mode-classifier-eval.sh

      - name: Upload mode-classifier eval report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mode-classifier-eval-report
          path: plugins/flow-architecture/tests/mode-classifier-eval-report.md
          retention-days: 30

  clone-drift-check:
    # BC-7060 advisory drift detection: compares FDA cloned commands
    # (session-start / review / ship) against current origin/main blobs of
    # plugins/workflows/commands/*. Promotes parking-lot #45 from manual-grep
    # contract to CI guard. Advisory (continue-on-error) per v1.0 spec —
    # promotion to hard-block deferred to v1.1.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    continue-on-error: true
    permissions:
      contents: read  # least-privilege — script only reads in-repo files
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0  # need full history for blob SHA lookups across refs

      - name: Detect FDA clone drift vs workflows-plugin
        run: bash plugins/flow-architecture/scripts/check-clone-drift.sh

  shift-left-clone-drift:
    # BC-12410 shift-left prevention: surfaces the FDA-clone re-sync obligation
    # ON the PR that edits a cloned upstream command (session-start / review /
    # ship), instead of (lagging, silent-at-source) on the next, unrelated PR —
    # which is all the clone-drift-check job above (origin/main, every PR) can
    # do. Thin path-filtered gate over the check-clone-drift.sh core (reused via
    # its additive CLONES_FILTER + UPSTREAM_REF env seams — the core's default
    # behaviour is unchanged), compared against the PR's HEAD: it does nothing
    # (and emits no noise) on PRs that don't touch a clone source, so the signal
    # is targeted, not cry-wolf. The clone-drift-check job above is intentionally
    # left untouched (BC-12410 AC#3 — no regression to the lagging backstop).
    #
    # PR-scoped: the "editing PR" is a pull_request concept, so this job is
    # gated to pull_request events (skipped on push-to-main, where there is no
    # PR to surface the obligation on and the origin/main backstop already runs).
    #
    # Advisory (continue-on-error) per BC-7060's advisory-v1.0 contract. To
    # promote to hard-block (BC-7060 v1.1 criterion — "if drift-rate empirically
    # motivates it"), drop the continue-on-error line below; no script change.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    continue-on-error: true
    permissions:
      contents: read  # least-privilege — script only reads in-repo files
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0  # need full history for blob SHA lookups + base diff

      - name: Surface FDA clone re-sync obligation on upstream-editing PRs
        run: bash plugins/flow-architecture/scripts/check-clone-drift-shiftleft.sh
        env:
          BASE_REF: origin/main
          HEAD_REF: HEAD

  eval-gate:
    # BC-12590 (M5 capstone) — the ADR-028 Phase-1 forward-only BLOCKING gate.
    # For each command CHANGED vs origin/main, fails the PR unless the two §0
    # non-negotiables hold (Split A′): structural R1 (disable-model-invocation)
    # blocks any changed command; the behavioral-eval requirement is grandfathered
    # by docs/skill-eval-debt.md (else needs a passing eval or a # eval-waiver).
    #
    # The LIVE diff-gate lives HERE — not in the `validate` job — because it needs
    # origin/main as a diff base: the `validate` job is a shallow checkout where
    # origin/main doesn't resolve, so a validate.sh-embedded diff-gate would
    # silently no-op. validate.sh runs the diff-FREE half (the self-test harness +
    # the --check debt-list integrity lint), which is shallow-safe. Same structure
    # as the shift-left-clone-drift job above (pull_request-scoped, fetch-depth: 0),
    # but BLOCKING — no continue-on-error: the Phase-1 discipline is real.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read  # least-privilege — the gate only reads in-repo files + a git diff
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0  # need origin/main as the diff base for the changed-command set

      - name: Fetch origin/main for the diff base
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Run the M5 eval gate (changed commands vs origin/main)
        run: python3 scripts/eval/eval_gate.py --base-ref origin/main --head-ref HEAD

      # ADR-034 (BC-13213) — the full-surface structural gate, second step of the
      # SAME required job so "eval-gate is the gate of record" stays true. Diff-free:
      # blocks any gate-tier structural-lint finding (promoted rules — R3 first) not
      # covered by docs/structural-lint-debt.md, across commands AND skills. Full
      # surface because the diff-gate's changed-set can't see SKILL.md files or an
      # R4 nested-refs regression introduced via a bundled-reference edit.
      # `!cancelled()`: run even when the diff-gate step fails, so a compound
      # failure surfaces BOTH verdicts in one CI run instead of hiding this one
      # behind the first (the job still fails either way).
      - name: Run the full-surface structural gate (ADR-034)
        if: ${{ !cancelled() }}
        run: python3 scripts/eval/eval_gate.py --structural

  cross-pr-adr-guard:
    # BC-12698 — surfaces a CROSS-PR ADR-number collision (two concurrently-open
    # PRs each ADDING the same docs/decisions/NNN-*.md with DIFFERENT slugs) BEFORE
    # either merges, as an advisory red naming the colliding PR so the author can
    # renumber before the cascade.
    #
    # COMPLEMENTS — does not duplicate — the within-repo guard (lint_adr_numbers.py
    # / validate.sh §15a-bc-12617): that one already catches a duplicate within one
    # PR's tree, post-merge on main, AND vs-main at PR time (the pull_request
    # merge-ref checkout = main ∪ this PR's added file, scanned as a tree). The one
    # window it CAN'T see is two OPEN PRs colliding before either merges — this job
    # closes that, and ONLY that (no vs-main check here; that would double-report).
    #
    # Thin adapter over the deterministic, unit-tested core
    # (scripts/_lib/lint_cross_pr_adr_numbers.py, mutation-locked in
    # validate.sh §15a-bc-12698). The adapter gathers the live open-PR set via gh —
    # non-deterministic, hence in a pull_request job, NOT in validate.sh (whose
    # shallow `validate` job can't see other PRs anyway; cf. BC-12590's
    # shallow-checkout-diff-gate gotcha).
    #
    # ADVISORY — and stays advisory. The signal is inherently racy: each PR's run
    # only sees what's open at that instant, BOTH colliding PRs may red on their own
    # runs, and there's no reliable "only the later one fails" ordering. Promoting a
    # non-deterministic signal to a required check would be a flaky gate — the real
    # guards are the within-repo backstop (§15a-bc-12617) + the claim-first
    # convention (CLAUDE.md ## Gotchas). This is the earlier-surface optimization,
    # valuable mainly when the convention is skipped, so continue-on-error stays.
    #
    # The DEFAULT (shallow) checkout is deliberate: the adapter is gh-API-only (it
    # reads each PR's added files via the GitHub API), so — unlike
    # shift-left-clone-drift / eval-gate, which do local git diffs/blob lookups — it
    # needs NO local git history; fetch-depth: 0 would be wasted work here.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    continue-on-error: true
    permissions:
      contents: read        # read the in-repo guard scripts
      pull-requests: read   # gh pr list + gh api pulls/*/files across the open PRs
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Surface cross-PR ADR-number collisions (advisory)
        run: bash scripts/ci/cross-pr-adr-guard.sh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
