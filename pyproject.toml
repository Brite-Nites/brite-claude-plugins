# Ruff configuration for brite-claude-plugins (BC-16867 — rationale in ADR-043).
#
# This file exists ONLY to configure ruff. There is deliberately NO [project] and
# NO [build-system] table: this repo is a plugin monorepo, not a Python package,
# and those tables would invite pip/setuptools to try to build it. (The root
# pyproject.toml that BC-16371 removed was a leaked lint FIXTURE — a stub with a
# fake project table. This one is real config.)
#
# Its presence intentionally re-arms the local Python path in
# `scripts/pre-commit.sh` and the workflows PreToolUse hook, both of which gate on
# `[ -f pyproject.toml ]`. The grandfather block below keeps both green on today's
# tree, so they only ever fire on NEW violations.

[tool.ruff]
# Floor across the repo — plugins/revops/pyproject.toml declares requires-python
# ">=3.10". That file keeps its own pytest/black/isort config; ruff config lives
# here at the root so one gate covers all 162 .py files.
target-version = "py310"

[tool.ruff.lint]
# E9 = syntax and IO errors. F = pyflakes: undefined names, unused imports,
# unused variables, duplicate dict keys. Real-bug rules only.
#
# Style, import-order and modernization rules (E/W/I/UP/B/SIM/…) are NOT selected
# on purpose: they report 1252 findings on this tree versus 130 for E9+F, so
# adopting them would mean grandfathering ten times the debt and churning nearly
# every Python file the moment anyone touches it. Widening the set is a
# deliberate future decision, not a default.
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
# GRANDFATHER — 130 pre-existing findings across 54 files, snapshotted 2026-07-29
# against ruff 0.16.0 (the version pinned in the python-lint CI job). This is what
# lets the gate go green on day one with zero code edits, and therefore zero
# plugin version bumps: 51 of the 54 files live under plugins/*/skills/**, where
# any edit would force a cache-invalidating bump inside what is otherwise a
# config-only change.
#
# Each row silences ONLY the codes that file already violates — a NEW violation of
# any other selected rule in these same files still blocks. The debt is almost
# entirely the vendored revops sf-skills tree.
#
# Burn-down is tracked separately (see the follow-up ticket referenced in ADR-043).
# To regenerate after a burn-down, rebuild this table from:
#   ruff check --select E9,F --output-format=concise .
# and to check remaining debt at a glance:
#   ruff check --select E9,F --statistics .
"plugins/marketing/scripts/_shared/manifest_loader.py" = ["F401"]
"plugins/marketing/scripts/lint_canonicals.py" = ["F841"]
"plugins/marketing/scripts/portfolio_snapshot.py" = ["F401"]
